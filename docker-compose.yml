services:
  #Laravel Service
  lr_app:
    runtime: runc
    container_name: lr_app
    restart: always
    tty: true
    working_dir: /var/www/app
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: ${REPO}
    environment:
      XDEBUG_CONFIG: "idekey=IDE_DEBUG"
      PHP_IDE_CONFIG: "serverName=laravel_react_app"
    volumes:
      - .:/var/www/app
    depends_on:
      - lr_database
    links:
      - lr_database
    networks:
      - lr_network
    ports:
      - "5173:5173"

  #DB Service
  lr_database:
    runtime: runc
    image: mariadb:latest
    container_name: lr_database
    restart: always
    working_dir: /etc/mysql
    tty: true
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - 3333:3306
    # volumes:
    #   - ./.docker/db/dump.sql:/docker-entrypoint-initdb.d/dump.sql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - lr_network

  #Nginx Service
  lr_server:
    runtime: runc
    image: nginx:alpine
    container_name: lr_server
    restart: always
    tty: true
    ports:
      - 8100:8080
    volumes:
      - .:/var/www/app
      - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf
    working_dir: /var/www
    depends_on:
      - lr_app
    networks:
      - lr_network

  pma:
    runtime: runc
    image: phpmyadmin/phpmyadmin
    container_name: lr_phpmyadmin
    restart: always
    ports:
      - "8101:80"
      # - "443:443"
    environment:
      - PMA_HOST=lr_database
      # - PMA_ARBITRARY=1

      # Careful: Uncomment these will expose your phpmyadmin login.
      # - PMA_USER=antonio
      # - PMA_PASSWORD=${DB_PASSWORD}
      # - PMA_DATABASE=lr_database
      # - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    # command: >
    #   sh -c "sed 's|/etc/ssl/certs/ssl-cert-snakeoil.pem|/etc/letsencrypt/live/${DOMAIN}/fullchain.pem|g' /etc/apache2/sites-available/default-ssl.conf > /tmp/default-ssl.conf &&
    #         sed -i 's|/etc/ssl/private/ssl-cert-snakeoil.key|/etc/letsencrypt/live/${DOMAIN}/privkey.pem|g' /tmp/default-ssl.conf &&
    #         mv /tmp/default-ssl.conf /etc/apache2/sites-available/default-ssl.conf &&
    #         a2enmod ssl &&
    #         a2ensite default-ssl &&
    #         if [ ! -f /etc/phpmyadmin/config.secret.inc.php ]; then
    #           echo \"<?php\\n\\\$$cfg['blowfish_secret'] = '$(php -r 'echo bin2hex(random_bytes(32));')';\" > /etc/phpmyadmin/config.secret.inc.php;
    #         fi && 
    #         apache2ctl -D FOREGROUND &
    #         while true; do
    #             sleep 12h
    #             apache2ctl graceful
    #         done
    #     "
    networks:
      - lr_network
#Docker Networks
networks:
  lr_network:
    driver: bridge
volumes:
  dbdata:
    driver: local

  node_modules:
    driver: locals
